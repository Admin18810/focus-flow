<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Focus Flow</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>Focus Flow</span>
      </div>
      <div class="streak" title="Consecutive days with a completed session">
        <span class="streak-flame">🔥</span>
        <span id="streakCount">0</span>
        <span class="streak-label">day streak</span>
      </div>
    </header>

    <main class="layout">
      <section class="timer-card">
        <div class="mode-tabs" id="modeTabs">
          <button class="mode-tab active" data-mode="focus">Focus</button>
          <button class="mode-tab" data-mode="short">Short Break</button>
          <button class="mode-tab" data-mode="long">Long Break</button>
        </div>

        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 300 300">
            <circle class="ring-track" cx="150" cy="150" r="135"></circle>
            <circle class="ring-progress" id="ringProgress" cx="150" cy="150" r="135"></circle>
          </svg>
          <div class="ring-center">
            <div class="time" id="timeDisplay">25:00</div>
            <div class="active-task" id="activeTaskLabel">No task selected</div>
          </div>
        </div>

        <div class="controls">
          <button class="btn btn-ghost" id="resetBtn" title="Reset timer">↺</button>
          <button class="btn btn-primary" id="startBtn">Start</button>
          <button class="btn btn-ghost" id="skipBtn" title="Skip to next">⏭</button>
        </div>

        <div class="session-dots" id="sessionDots"></div>

        <div class="stats-row">
          <div class="stat">
            <div class="stat-value" id="sessionsToday">0</div>
            <div class="stat-label">sessions today</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="focusMinutesToday">0</div>
            <div class="stat-label">focus minutes</div>
          </div>
        </div>
      </section>

      <section class="task-card">
        <div class="task-header">
          <h2>Tasks</h2>
          <span class="task-count" id="taskCount">0 left</span>
        </div>

        <form id="taskForm" class="task-form">
          <input type="text" id="taskInput" placeholder="What are you working on?" autocomplete="off" />
          <button type="submit" class="btn btn-primary btn-small">Add</button>
        </form>

        <ul class="task-list" id="taskList"></ul>

        <div class="empty-state" id="emptyState">
          <p>No tasks yet. Add one and click it to focus 🎯</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <label class="settings-toggle">
        <span>Durations:</span>
        <input type="number" id="focusMinInput" min="1" max="120" value="25" />
        <span>/</span>
        <input type="number" id="shortMinInput" min="1" max="60" value="5" />
        <span>/</span>
        <input type="number" id="longMinInput" min="1" max="90" value="15" />
        <span class="settings-hint">focus / short / long (min)</span>
      </label>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
